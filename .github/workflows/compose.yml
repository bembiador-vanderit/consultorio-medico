name: Compose validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create local environment
        run: cp .env.example .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Check migrations
        run: docker compose exec -T backend alembic current

      - name: Run backend tests
        run: docker compose exec -T backend python -m pytest -q

      - name: Validate frontend build
        run: docker compose exec -T frontend npm run build

      - name: Shutdown
        if: always()
        run: docker compose down -v
