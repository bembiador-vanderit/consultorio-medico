name: Compose validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=consultorio_medico_ci
          POSTGRES_USER=consultorio_user_ci
          POSTGRES_PASSWORD=ci_test_password
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql+psycopg://consultorio_user_ci:ci_test_password@postgres:5432/consultorio_medico_ci
          SECRET_KEY=ci_test_secret_key_do_not_use_in_production
          INITIAL_ADMIN_EMAIL=admin@consultorio.com
          INITIAL_ADMIN_PASSWORD=ci_admin_password
          INITIAL_ADMIN_NAME=Administrador CI
          BACKEND_PORT=8000
          FRONTEND_PORT=5173
          EOF

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for backend health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8000/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --no-color
          exit 1

      - name: Check migrations
        run: docker compose exec -T backend alembic current

      - name: Run backend tests
        run: docker compose exec -T backend python -m pytest -q

      - name: Validate frontend build
        run: docker compose exec -T frontend npm run build

      - name: Show service status
        run: docker compose ps

      - name: Shutdown
        if: always()
        run: docker compose down -v
