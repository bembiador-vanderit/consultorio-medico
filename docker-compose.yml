services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-consultorio_medico}
      POSTGRES_USER: ${POSTGRES_USER:-consultorio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consultorio_user} -d ${POSTGRES_DB:-consultorio_medico}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: { context: ./backend }
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD must be set in .env}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Administrador inicial}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: ["./backend:/app"]
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    build: { context: ./frontend }
    ports: ["${FRONTEND_PORT:-5173}:5173"]
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    depends_on: [backend]
volumes:
  postgres_data:
  frontend_node_modules:
